<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Lion preview — Dan replaces Mochi</title>
    <style>
      html, body { margin: 0; background: #222; height: 100%; }
      body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; font-family: system-ui, sans-serif; }
      #stage { background: #2e3a48; border-radius: 16px; }
      #label { color: #fff; font-size: 20px; }
      #states { display: flex; gap: 8px; }
      button { padding: 6px 12px; font-size: 15px; border-radius: 8px; border: 0; cursor: pointer; }
      button.on { background: #f5a623; }
    </style>
  </head>
  <body>
    <canvas id="stage" width="360" height="360"></canvas>
    <div id="label">idle</div>
    <div id="states"></div>
    <canvas id="greet" width="640" height="150" style="background:#2e3a48;border-radius:16px;margin-top:16px"></canvas>
    <div style="color:#888">greeting (first launch)</div>
    <script type="module">
      import { BotEngine } from "/src/mochi/engine.ts";
      import { Greeting } from "/src/mochi/greeting.ts";

      const STATES = ["idle", "working", "thinking", "approval", "question", "error", "finished", "sleeping", "dizzy"];
      const params = new URLSearchParams(location.search);
      let current = params.get("state") || "idle";
      if (!STATES.includes(current)) current = "idle";

      const canvas = document.getElementById("stage");
      const ctx = canvas.getContext("2d");
      const label = document.getElementById("label");
      const statesEl = document.getElementById("states");
      for (const s of STATES) {
        const b = document.createElement("button");
        b.textContent = s;
        if (s === current) b.classList.add("on");
        b.onclick = () => {
          const u = new URL(location.href);
          u.searchParams.set("state", s);
          location.href = u.toString();
        };
        statesEl.appendChild(b);
      }

      const engine = new BotEngine();
      engine.setState(current, true);
      label.textContent = current;

      const dpr = window.devicePixelRatio || 1;
      canvas.width = 360 * dpr;
      canvas.height = 360 * dpr;
      canvas.style.width = "360px";
      canvas.style.height = "360px";

      let last = performance.now();
      const greet = new Greeting();
      try { greet.start(); } catch { /* sound unavailable headless */ }
      const gcanvas = document.getElementById("greet");
      const gctx = gcanvas.getContext("2d");
      function frame(now) {
        const dt = Math.min(0.05, (now - last) / 1000);
        last = now;
        engine.update(dt);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, 360, 360);
        ctx.save();
        engine.applyDance(ctx, 360, 360);
        engine.draw(ctx, 360, 360);
        ctx.restore();
        gctx.clearRect(0, 0, 640, 150);
        try { greet.draw(gctx); } catch { /* ignore */ }
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    </script>
  </body>
</html>
